name: gearbound
description: "Gearbound: Wasteland Warriors playable prototype."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Synced from ../shared by tools/build/sync_flutter_shared.py; do not edit here.
  assets:
    - assets/shared/configs/
    - assets/shared/gears/
    - assets/shared/enemies/
    - assets/shared/economy/
    - assets/shared/waves/
    - assets/shared/missions/
    - assets/shared/events/
    - assets/shared/monetization/
